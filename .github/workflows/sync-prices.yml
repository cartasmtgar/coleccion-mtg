name: Sync precios Scryfall

# Sincroniza SOLO precios cada 12 horas (00:00 y 12:00 UTC).
# Escribe únicamente las filas cuyo precio cambió + la fecha en sync_meta.
# La service_role key vive SOLO en GitHub Secrets, nunca en el repo.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: # botón "Run workflow" para forzar una corrida manual

permissions:
  contents: read

concurrency:
  group: sync-prices
  cancel-in-progress: false # si una corrida sigue andando, la siguiente espera

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar precios
        run: node scripts/sync-prices.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
